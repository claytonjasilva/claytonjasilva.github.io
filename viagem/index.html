<!doctype html>
<!-- Viagem de Moto. Criação: 17/11/2026. Versão: 1.0. Copyright Clayton Silva. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viagem de Moto</title>
</head>
<body>
  <p id="aviso" role="status">Carregando roteiro e gestão da viagem…</p>

  <script>
    async function carregarAplicacao() {
      const aviso = document.getElementById('aviso');
      if (location.protocol === 'file:') {
        aviso.textContent = 'Abra esta página pelo GitHub Pages ou pelo Live Server do VS Code.';
        return;
      }

      try {
        const resposta = await fetch('./roteiro-nordeste/index.html');
        if (!resposta.ok) throw new Error('Confira a pasta roteiro-nordeste.');
        const original = await resposta.text();
        const ponto = '    initSyncPanel();';
        if (!original.includes(ponto)) {
          throw new Error('Restaure o index.html original dentro de roteiro-nordeste.');
        }

        const painel = `
          <style>
            #gestao-moto { margin: 16px auto; padding: 16px; border: 1px solid currentColor; border-radius: 14px; }
            #gestao-moto label { display: block; margin: 10px 0; }
            #gestao-moto input, #gestao-moto button { font: inherit; min-height: 48px; max-width: 100%; }
            #gestao-moto a { display: inline-block; padding: 12px 8px; }
            #gestao-moto [hidden] { display: none !important; }
            #gestao-moto li { margin: 8px 0; }
            #gestao-moto img, #gestao-moto video { display: block; max-width: 100%; max-height: 280px; }
          </style>
          <section id="gestao-moto" class="shell-col" aria-label="Gestão da viagem">
            <h2>Viagem de Moto</h2>
            <p data-ui="estado" role="status"></p>

            <div data-ui="planejamento">
              <details>
                <summary>Adicionar trecho</summary>
                <a href="https://www.google.com/maps/dir/?api=1" target="_blank" rel="noopener">📍 Importar trecho</a>
                <form data-acao="importar">
                  <label>Ao voltar do Maps, cole o endereço completo da rota
                    <input name="url" type="url" required>
                  </label>
                  <button>Preencher pontos</button>
                </form>
                <form data-acao="trecho">
                  <label>Origem <input name="origem" required></label>
                  <label>Destino <input name="destino" required></label>
                  <label>Data <input name="dia" type="date" required></label>
                  <label>Rodovias em ordem <input name="rodovias" placeholder="BR-116 → BR-324 → BR-407"></label>
                  <label>Pontos de passagem separados por | <input name="pontos"></label>
                  <label>Distância total (km) <input name="km" type="number" min="0.1" step="any" required></label>
                  <button>Salvar trecho adicional</button>
                </form>
                <ul data-ui="extras"></ul>
              </details>

              <form data-acao="partida">
                <label>Hodômetro na partida (km) <input name="km" type="number" min="0" step="1" required></label>
                <button>Confirmar partida e congelar a linha de base</button>
              </form>
            </div>

            <div data-ui="execucao" hidden>
              <h3>Hoje</h3>
              <p data-ui="atual"></p>
              <div data-ui="navegacao">
                <a data-ui="maps" target="_blank" rel="noopener">🧭 Google Maps</a>
                <a data-ui="waze" target="_blank" rel="noopener">🧭 Waze</a>
              </div>
              <form data-acao="previsao">
                <label>Previsão de chegada <input name="quando" type="datetime-local" required></label>
                <button>Atualizar previsão</button>
              </form>
              <form data-acao="chegada">
                <label>Chegada realizada <input name="quando" type="datetime-local" required></label>
                <button>Marcar chegada</button>
              </form>
              <button type="button" data-gasto="alimentacao">🍽 Registrar alimentação</button>
              <button type="button" data-gasto="combustivel">⛽ Registrar combustível</button>
              <details>
                <summary>Registros da viagem</summary>
                <form data-acao="registro">
                  <label>Anotação ou legenda <input name="nota" maxlength="250"></label>
                  <label>Foto ou vídeo <input name="arquivo" type="file" accept="image/*,video/*"></label>
                  <button>Salvar registro</button>
                </form>
              </details>
              <form data-acao="encerrar">
                <label>Hodômetro final (km) <input name="km" type="number" min="0" step="1" required></label>
                <button>Encerrar viagem</button>
              </form>
            </div>

            <details data-ui="comparativo" hidden>
              <summary>Roteiro · Planejado, previsão e realizado</summary>
              <ol data-ui="linhas"></ol>
            </details>
            <details data-ui="diario" hidden>
              <summary>Diário da viagem</summary>
              <ul data-ui="registros"></ul>
            </details>
            <details data-ui="relatorio" hidden>
              <summary>Relatório final</summary>
              <form data-acao="relatorio">
                <label>Categoria
                  <select name="categoria">
                    <option>Completo</option>
                    <option>Itinerário</option>
                    <option>Hospedagens</option>
                    <option>Despesas</option>
                    <option>Registros</option>
                  </select>
                </label>
                <button>Gerar relatório</button>
              </form>
              <div data-ui="resultado"></div>
            </details>
            <p data-ui="mensagem" role="alert"></p>
          </section>`;

        const fonte = original
          .replace('<main class="app-content">', '<main class="app-content">' + painel)
          .replace(
            ponto,
            ponto + '\n(' + iniciarGestao.toString() + ')();'
          );

        document.open();
        document.write(fonte);
        document.close();
      } catch (erro) {
        aviso.textContent = 'Não foi possível carregar o aplicativo. ' + erro.message;
      }
    }

    // Esta função roda junto ao roteiro original e reutiliza seus dados e formulários.
    function iniciarGestao() {
      const painel = document.getElementById('gestao-moto');
      const ui = nome => painel.querySelector('[data-ui="' + nome + '"]');
      const formulario = nome => painel.querySelector('[data-acao="' + nome + '"]');
      const chave = 'viagem-moto-execucao-v1';
      const dinheiro = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
      let urls = [];

      function carregar() {
        return JSON.parse(localStorage.getItem(chave) || '{"extras":[],"viagem":null}');
      }

      function salvar(dados) {
        localStorage.setItem(chave, JSON.stringify(dados));
      }

      function item(lista, texto, tipo = 'li') {
        const elemento = document.createElement(tipo);
        elemento.textContent = texto;
        lista.appendChild(elemento);
        return elemento;
      }

      function proximo(viagem) {
        return viagem.base.trechos.find(trecho => trecho.to && !viagem.chegadas[trecho.idx]);
      }

      function importarRota(endereco) {
        const url = new URL(endereco);
        const hostValido = /^(?:(?:www|maps)\.)?google\.com(?:\.br)?$/.test(url.hostname);
        if (url.protocol !== 'https:' || !hostValido || !/^\/maps\/dir(?:\/|$)/.test(url.pathname)) {
          throw new Error('Abra o link no Google Maps e copie o endereço completo da tela de rotas.');
        }

        const pontos = url.pathname.split('/').slice(3)
          .filter(ponto => ponto && !ponto.startsWith('@') && !ponto.startsWith('data='))
          .map(ponto => decodeURIComponent(ponto.replaceAll('+', ' ')));

        const origem = url.searchParams.get('origin') || pontos[0];
        const destino = url.searchParams.get('destination') || (pontos.length > 1 ? pontos.at(-1) : '');
        if (!origem || !destino) throw new Error('Defina a origem e o destino no Google Maps.');

        const campos = formulario('trecho').elements;
        campos.origem.value = origem;
        campos.destino.value = destino;
        campos.pontos.value = url.searchParams.get('waypoints') || pontos.slice(1, -1).join('|');
        campos.dia.focus();
      }

      function linhasDoRoteiro(viagem) {
        return viagem.base.trechos.map(trecho => {
          const previsto = viagem.previsoes[trecho.idx]?.replace('T', ' às ') || '—';
          const realizado = viagem.chegadas[trecho.idx]?.replace('T', ' às ') || '—';
          return trecho.date + ' · ' + trecho.route + ' · ' + trecho.km +
            ' km planejados · Previsão ' + previsto + ' · Chegada ' + realizado;
        });
      }

      async function mostrarRegistros(viagem, lista) {
        for (const registro of viagem.registros) {
          const linha = item(lista, new Date(registro.data).toLocaleString('pt-BR') +
            ' · ' + registro.trecho + (registro.nota ? ' · ' + registro.nota : ''));
          if (!registro.id || !localCap) continue;

          const arquivo = await localCap.assets.getBlob(registro.id);
          if (!arquivo || !linha.isConnected) continue;
          const video = registro.tipo.startsWith('video/');
          const midia = document.createElement(video ? 'video' : 'img');
          midia.src = URL.createObjectURL(arquivo);
          urls.push(midia.src);
          if (video) {
            midia.controls = true;
            midia.preload = 'metadata';
            midia.playsInline = true;
          } else {
            midia.alt = registro.nota || 'Foto da viagem';
          }
          linha.appendChild(midia);
        }
      }

      function desenhar(dados) {
        const viagem = dados.viagem;
        ui('planejamento').hidden = Boolean(viagem);
        ui('execucao').hidden = !viagem || Boolean(viagem.fim);
        ui('comparativo').hidden = !viagem;
        ui('diario').hidden = !viagem;
        ui('relatorio').hidden = !viagem?.fim;
        ui('estado').textContent = !viagem
          ? 'Em planejamento'
          : viagem.fim ? 'Encerrada · Linha de base preservada' : 'Em execução · Linha de base congelada';

        ui('extras').replaceChildren();
        dados.extras.forEach(trecho => item(ui('extras'), trecho.date + ' · ' + trecho.route));
        if (!viagem) return;

        const trecho = proximo(viagem);
        ui('atual').textContent = trecho
          ? trecho.route + ' · ' + trecho.km + ' km planejados'
          : 'Chegadas registradas para todos os trechos com destino.';
        ui('navegacao').hidden = !trecho;
        for (const nome of ['previsao', 'chegada']) {
          formulario(nome).hidden = !trecho;
          formulario(nome).dataset.trecho = trecho ? String(trecho.idx) : '';
        }

        if (trecho) {
          ui('maps').href = mapsUrl(trecho.from, trecho.to, trecho.waypoints || []);
          ui('waze').href = 'https://waze.com/ul?' + new URLSearchParams({
            q: trecho.waypoints?.[0] || trecho.to,
            navigate: 'yes'
          });
          formulario('previsao').elements.quando.value = viagem.previsoes[trecho.idx] || '';
          formulario('chegada').reset();
        }

        formulario('encerrar').elements.km.min = viagem.kmInicial;
        ui('linhas').replaceChildren();
        linhasDoRoteiro(viagem).forEach(texto => item(ui('linhas'), texto));

        urls.forEach(url => URL.revokeObjectURL(url));
        urls = [];
        ui('registros').replaceChildren();
        mostrarRegistros(viagem, ui('registros')).catch(erro => {
          ui('mensagem').textContent = 'Erro ao carregar mídia. ' + erro.message;
        });
      }

      async function gerarRelatorio(viagem, categoria) {
        const resultado = ui('resultado');
        resultado.replaceChildren();
        const inclui = nome => categoria === 'Completo' || categoria === nome;
        const linha = texto => item(resultado, texto, 'p');

        linha('Distância pelo hodômetro · ' + (viagem.kmFinal - viagem.kmInicial) + ' km');

        if (inclui('Itinerário')) linhasDoRoteiro(viagem).forEach(linha);
        if (inclui('Hospedagens')) {
          viagem.base.estadias.forEach(estadia => {
            linha(estadia.cidade + ' · ' + (estadia.familia ? 'Casa de familiares' : estadia.reserva || 'Sem reserva na partida'));
          });
        }
        if (inclui('Despesas')) {
          const despesas = await db.collection('despesas').get();
          const totais = new Map();
          despesas.docs.forEach(doc => {
            const gasto = doc.data();
            const categoria = DESP_CAT_LABEL[gasto.categoria] || 'Outros';
            totais.set(categoria, (totais.get(categoria) || 0) + (Number(gasto.valor) || 0));
          });
          if (!totais.size) linha('Nenhuma despesa registrada.');
          for (const [nome, total] of totais) linha(nome + ' · ' + dinheiro.format(total));
        }
        if (inclui('Registros')) {
          linha('Fotos, vídeos e anotações no Diário da viagem.');
          ui('diario').open = true;
        }
      }

      painel.addEventListener('click', evento => {
        const botao = evento.target.closest('[data-gasto]');
        if (!botao) return;
        document.querySelector('[data-tab="despesas"]')?.click();
        const categoria = document.getElementById('desp-categoria');
        if (!categoria) return;
        categoria.value = botao.dataset.gasto;
        categoria.dispatchEvent(new Event('change'));
        document.getElementById('desp-valor')?.focus();
      });

      painel.addEventListener('submit', async evento => {
        evento.preventDefault();
        if (painel.dataset.salvando) return;
        painel.dataset.salvando = 'sim';
        ui('mensagem').textContent = '';
        const form = evento.target;
        const acao = form.dataset.acao;
        const valores = new FormData(form);
        const trechoExibido = form.dataset.trecho;

        async function executar() {
          const dados = carregar();
          const viagem = dados.viagem;

          if (acao === 'relatorio') {
            if (viagem?.fim) await gerarRelatorio(viagem, valores.get('categoria'));
            return;
          }

          if (acao === 'importar' || acao === 'trecho' || acao === 'partida') {
            if (viagem) return desenhar(dados);

            if (acao === 'importar') {
              importarRota(valores.get('url'));
              ui('mensagem').textContent = 'Pontos preenchidos. Confira os dados antes de salvar.';
              return;
            }

            if (acao === 'trecho') {
              const origem = valores.get('origem').trim();
              const destino = valores.get('destino').trim();
              if (!origem || !destino || origem.localeCompare(destino, 'pt-BR', { sensitivity: 'base' }) === 0) {
                throw new Error('Informe origem e destino distintos.');
              }
              const iso = valores.get('dia');
              dados.extras.push({
                idx: 'extra-' + crypto.randomUUID(),
                iso,
                date: iso.slice(5).split('-').reverse().join('/'),
                route: origem + ' → ' + destino,
                from: origem,
                to: destino,
                via: valores.get('rodovias').trim(),
                waypoints: valores.get('pontos').split('|').map(ponto => ponto.trim()).filter(Boolean),
                km: Number(valores.get('km'))
              });
            } else {
              if (!confirm('Confirmar a partida e congelar a linha de base?')) return;
              const trechos = buildEffectiveList().map(trecho => ({
                ...trecho,
                iso: toISODate(trecho.date)
              })).concat(dados.extras).sort((a, b) => a.iso.localeCompare(b.iso));

              const estadias = await Promise.all(ALL_STOPS.map(async parada => {
                const doc = await db.doc('hospedagem/' + parada.slug).get();
                return {
                  cidade: parada.city,
                  familia: effectiveFamily(parada),
                  reserva: doc.data()?.url || ''
                };
              }));

              dados.viagem = {
                inicio: new Date().toISOString(),
                kmInicial: Number(valores.get('km')),
                base: { trechos, estadias },
                previsoes: {},
                chegadas: {},
                registros: []
              };
            }
          } else {
            if (!viagem || viagem.fim) return desenhar(dados);
            const trecho = proximo(viagem);

            if (acao === 'previsao' || acao === 'chegada') {
              if (!trecho || String(trecho.idx) !== trechoExibido) return desenhar(dados);
              const registros = acao === 'previsao' ? viagem.previsoes : viagem.chegadas;
              registros[trecho.idx] = valores.get('quando');
            }

            if (acao === 'encerrar') {
              const km = Number(valores.get('km'));
              if (km < viagem.kmInicial) throw new Error('Confira o hodômetro final.');
              if (!confirm(trecho ? 'Há chegadas pendentes. Encerrar a viagem?' : 'Encerrar a viagem?')) return;
              viagem.kmFinal = km;
              viagem.fim = new Date().toISOString();
            }

            if (acao === 'registro') {
              const nota = valores.get('nota').trim();
              const arquivo = valores.get('arquivo');
              if (!nota && !arquivo.size) throw new Error('Adicione uma foto, um vídeo ou uma anotação.');
              let midia;
              if (arquivo.size) {
                if (!localCap) throw new Error('O armazenamento local de mídia está indisponível.');
                if (!/^(image|video)\//.test(arquivo.type)) throw new Error('Selecione uma foto ou um vídeo.');
                midia = await localCap.assets.upload(arquivo);
                URL.revokeObjectURL(midia.url);
              }
              viagem.registros.push({
                data: new Date().toISOString(),
                trecho: trecho?.route || 'Viagem',
                nota,
                id: midia?.id,
                tipo: arquivo.type
              });
              try {
                salvar(dados);
              } catch (erro) {
                if (midia) await localCap.assets.delete(midia.id);
                throw erro;
              }
              form.reset();
              desenhar(dados);
              ui('diario').open = true;
              return;
            }
          }

          salvar(dados);
          form.reset();
          desenhar(dados);
        }

        try {
          if (navigator.locks) await navigator.locks.request(chave, executar);
          else await executar();
        } catch (erro) {
          ui('mensagem').textContent = erro.message;
        } finally {
          delete painel.dataset.salvando;
        }
      });

      try {
        desenhar(carregar());
      } catch (erro) {
        ui('mensagem').textContent = 'Não foi possível ler os dados salvos. ' + erro.message;
      }
    }

    carregarAplicacao();
  </script>
</body>
</html>
