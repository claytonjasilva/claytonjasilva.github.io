<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AHP • Laboratório de decisões</title>
<style>
:root{--ink:#16324a;--teal:#087f79;--paper:#f3f6f8;--line:#dce5eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,Segoe UI,sans-serif}header{background:#102e43;color:white;padding:28px 5%;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{margin:4px 0;font-size:29px;letter-spacing:-1px}h2{margin-top:0;font-size:25px}h3{font-size:18px}p{line-height:1.6}.eyebrow{font-size:12px;letter-spacing:2px;color:#87d5cd}button,.file{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px 15px;font:inherit;cursor:pointer;display:inline-block}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #e4b947;outline-offset:3px}button:hover,.file:hover{border-color:var(--teal);background:#edf8f6}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.small{padding:6px 10px;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:20px 5%;background:white;border-bottom:1px solid var(--line)}nav button.active{background:#16324a;color:white}main{max-width:1180px;margin:28px auto;padding:0 24px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:20px;box-shadow:0 4px 15px #16324a05}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}label{display:block;font-size:14px;font-weight:600;margin:15px 0 7px}input,textarea,select{font:inherit;padding:10px;border:1px solid #b9cbd5;border-radius:7px;background:white;color:var(--ink);max-width:100%}input,textarea{width:100%}textarea{min-height:80px}small,.muted{color:#607787;font-size:14px}.row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}.row input{flex:1;min-width:120px}.node{border-left:3px solid #a3d6d0;padding:8px 0 8px 20px;margin:10px 0 10px 12px}.pill{display:inline-block;background:#e7f5f2;color:#08756f;border-radius:20px;padding:5px 11px;font-size:13px}.warn{background:#fff3dc;border-left:4px solid #d88d20;padding:15px;border-radius:6px;margin:14px 0}.good{background:#e7f5ee;border-left:4px solid #298561;padding:15px;border-radius:6px;margin:14px 0}.pair{display:grid;grid-template-columns:1fr minmax(200px,1.2fr) 1fr;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.pair span:last-child{text-align:right}.pair select{width:100%}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line)}th{background:#f2f7f9}.scroll{overflow:auto}details{margin:18px 0}summary{cursor:pointer;font-weight:600}.bar{height:12px;background:#e6eef2;border-radius:8px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:var(--teal)}.rank{display:flex;justify-content:space-between;font-size:19px;font-weight:650}a{color:var(--teal)}footer{text-align:center;padding:25px;color:#607787;font-size:13px}#toast{position:fixed;bottom:20px;right:20px;background:#16324a;color:white;padding:14px 20px;border-radius:9px;display:none;z-index:9}progress{width:100%;accent-color:var(--teal);height:9px} @media(max-width:750px){.grid{grid-template-columns:1fr}header{display:block}.pair{grid-template-columns:1fr}.pair span:last-child{text-align:left}main{padding:0 12px}.card{padding:18px}header .row{margin-top:20px}}@media print{header .row,nav,button,.file,footer{display:none!important}body{background:white}main{max-width:none;margin:0}.card{box-shadow:none;break-inside:avoid}details{display:block}details>*{display:block}a{color:inherit}}

.learning{background:#eaf5f4;border:1px solid #b7ded8;border-radius:12px;padding:18px 22px;margin:18px 0}.learning h3{margin:0 0 7px}.learning p{margin:5px 0}.journey{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.journey span{padding:7px 12px;border-radius:20px;background:#eef3f6;font-size:13px}.journey .current{background:#d9eee9;color:#076e66}.compare-stage{text-align:center;padding:20px 0}.compare-cards{display:grid;grid-template-columns:1fr 55px 1fr;gap:15px;align-items:center;margin:25px 0}.choice-card{min-height:120px;border:2px solid #dce5eb;padding:22px 14px;border-radius:14px;font-size:21px;display:flex;justify-content:center;align-items:center;flex-direction:column;background:#f7fafb}.choice-card strong{font-size:12px;letter-spacing:1px;color:#607787;margin-bottom:10px}.choice-card.chosen{border-color:#087f79;background:#e8f6f3}.vs{font-size:14px;color:#738695}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.choices button.selected{background:#087f79;color:white;border-color:#087f79}.strengths{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.strengths button{width:46px;padding:10px}.strengths button.selected{background:#16324a;color:white}.preview{font-size:18px;line-height:1.7;background:#f1f6f8;border-radius:10px;padding:18px;margin:20px 0}.group-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:20px 0}.group-item{text-align:left;min-height:100px}.group-item strong{display:block;margin-bottom:7px}.org{overflow:auto;padding:12px 0 25px}.org-root{width:fit-content;max-width:400px;margin:auto;background:#16324a;color:white;border-radius:12px;padding:20px 28px;text-align:center;font-size:19px}.org-root small{display:block;color:#a8d9d3;margin-bottom:7px}.org-children{display:flex;justify-content:center;gap:18px;padding-top:30px;position:relative;min-width:fit-content}.org-children:before{content:'';position:absolute;top:0;height:30px;width:2px;background:#8bbcb7;left:50%}.org-branch{position:relative;display:flex;flex-direction:column;align-items:center;flex:1;min-width:180px;padding-top:16px;border-top:2px solid #8bbcb7}.org-branch:before{content:'';position:absolute;height:16px;width:2px;background:#8bbcb7;top:0;left:50%}.org-box{border:1px solid #93c7c0;border-top:4px solid #087f79;background:white;border-radius:9px;min-width:170px;max-width:270px;padding:16px;text-align:center;overflow-wrap:anywhere}.org-box small{display:block;margin-bottom:5px;font-size:11px;text-transform:uppercase;letter-spacing:1px}.org-leaf{margin-top:20px;border:1px dashed #afc4cf;border-radius:10px;background:#f1f6f9;padding:12px;width:90%;max-width:260px;position:relative}.org-leaf:before{content:'';position:absolute;top:-21px;left:50%;height:20px;width:2px;background:#afc4cf}.org-alt{background:white;border-radius:6px;padding:8px;margin:6px 0;font-size:14px}.matrix-auto{background:#f1f5f7;color:#607787}.matrix-direct{background:#e5f4f0;color:#075f58}.matrix-diag{background:#e4eaf0;color:#607787}.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;margin:14px 0}.lesson-number{font-size:38px;font-weight:750;color:#8cb8b2;margin-right:15px}.lesson-row{display:flex;align-items:flex-start;margin:18px 0}.lesson-row p{margin:0}.completion-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:650px){.compare-cards{grid-template-columns:1fr 28px 1fr;gap:6px}.choice-card{font-size:17px;padding:15px 8px}.org-children{justify-content:flex-start}.org-root{margin-left:auto;margin-right:auto}.org{font-size:14px}}@media print{.org{overflow:visible}.choices,.strengths,.completion-actions{display:none}}
</style>
<header><div><div class="eyebrow">LABORATÓRIO DE DECISÕES</div><h1>AHP · Análise multicritério</h1><small style="color:#b7d3e2">Da estrutura da decisão às prioridades finais.</small></div><div class="row"><button onclick="newAnalysis()">Nova análise</button><label class="file" style="margin:0">Abrir análise<input type="file" accept=".json" hidden onchange="loadFile(this)"></label><button class="primary" onclick="saveFile()">Salvar trabalho</button></div></header>
<nav id="nav"></nav><main id="app"></main><footer>Funciona offline · Dados processados neste navegador · Use “Salvar trabalho” para guardar uma cópia portátil.</footer><div id="toast" role="status"></div>
<script>
'use strict';
const RI=[0,0,0,.58,.90,1.12,1.24,1.32,1.41,1.45,1.49];
const steps=['Comece aqui','Explore a árvore','Compare os pares','Interprete o resultado','Entenda o método'];
const uid=()=> 'n'+Math.random().toString(36).slice(2,12);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>(100*x).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
const num=x=>x.toLocaleString('pt-BR',{maximumFractionDigits:5});
function blank(){return {format:'AHP-Lab',version:1,title:'Minha análise',goal:'',notes:'',root:{id:'root',name:'Objetivo',children:[]},alternatives:[],judgments:{},finalized:false}}
let state=blank(),tab=0,selected='root',dirty=false;
try{const s=localStorage.getItem('ahp-lab-v1');if(s)state=validate(JSON.parse(s))}catch(e){}
function touch(){state.finalized=false;dirty=true;try{localStorage.setItem('ahp-lab-v1',JSON.stringify(state))}catch(e){} }
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function find(id,n=state.root){if(n.id===id)return n;for(const c of n.children){const r=find(id,c);if(r)return r}}
function contexts(){const out=[];function walk(n,path){const children=n.children.length?n.children:state.alternatives;if(n===state.root||n.children.length||state.root.children.length)out.push({id:n.id,name:path,items:children,leaf:!n.children.length});n.children.forEach(c=>walk(c,path+' / '+c.name))}walk(state.root,state.goal||'Objetivo');return out}
function key(a,b){return a+'|'+b}
function value(ctx,a,b){if(a===b)return 1;const j=state.judgments[ctx]||{};if(j[key(a,b)]!==undefined)return j[key(a,b)];if(j[key(b,a)]!==undefined)return 1/j[key(b,a)];return null}
function eigen(A){const n=A.length;if(!n)return {w:[],lambda:0,ci:0,cr:0};let w=Array(n).fill(1/n);for(let k=0;k<10000;k++){let v=A.map(r=>r.reduce((s,a,i)=>s+a*w[i],0)),sum=v.reduce((a,b)=>a+b,0);v=v.map(x=>x/sum);const err=Math.max(...v.map((x,i)=>Math.abs(x-w[i])));w=v;if(err<1e-13)break}const aw=A.map(r=>r.reduce((s,a,i)=>s+a*w[i],0)),lambda=aw.reduce((s,x,i)=>s+x/w[i],0)/n,ci=n>2?Math.max(0,(lambda-n)/(n-1)):0;return {w,lambda,ci,cr:n>2?ci/RI[n]:0}}
function calc(c){const n=c.items.length;let done=0;const A=c.items.map((a,i)=>c.items.map((b,j)=>{const v=value(c.id,a.id,b.id);if(i<j&&v!==null)done++;return v})),total=n*(n-1)/2,complete=done===total&&n>0;return {A,done,total,complete,...(complete?eigen(A):{w:[],lambda:0,ci:0,cr:0})}}
function validStructure(){return state.goal.trim()&&state.root.children.length>=2&&state.alternatives.length>=2}
function status(){const cs=contexts(),rs=cs.map(calc);return {cs,rs,done:rs.reduce((s,r)=>s+r.done,0),total:rs.reduce((s,r)=>s+r.total,0),complete:!!validStructure()&&rs.every(r=>r.complete),bad:rs.filter(r=>r.complete&&r.cr>.1+1e-10).length}}
function setField(field,v){state[field]=v;touch()}
function rename(id,v){const n=find(id)||state.alternatives.find(a=>a.id===id);n.name=v;touch()}
function add(parent){const list=parent==='alts'?state.alternatives:find(parent).children;if(list.length>=10)return notify('Limite de 10 elementos por grupo para a tabela de IR adotada.');list.push({id:uid(),name:parent==='alts'?'Nova alternativa':'Novo critério',children:[]});touch();render()}
function remove(id,parent){if(!confirm('Excluir este elemento e seus descendentes? Os julgamentos restantes serão preservados.'))return;const list=parent==='alts'?state.alternatives:find(parent).children;list.splice(list.findIndex(x=>x.id===id),1);touch();render()}
function editor(n,parent,depth){return `<div class="node"><div class="row"><input aria-label="Nome do critério" value="${esc(n.name)}" onchange="rename('${n.id}',this.value)"><button class="small" onclick="add('${n.id}')">+ Subcritério</button><button class="small" onclick="remove('${n.id}','${parent}')">Excluir</button></div>${n.children.map(c=>editor(c,n.id,depth+1)).join('')}</div>`}
function render(){document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${i+1}. ${s}</button>`).join('');const views=[structure,tree,judgments,result,method];document.getElementById('app').innerHTML=views[tab]()}
function structure(){return `<div class="card"><span class="pill">1 · Modele a decisão</span><h2 style="margin-top:15px">O que você precisa decidir?</h2><p class="muted">Defina critérios distintos e comparáveis. Cada grupo aceita até 10 elementos. Subcritérios podem ter outros níveis.</p><div class="grid"><div><label>Título da análise</label><input value="${esc(state.title)}" onchange="setField('title',this.value)"><label>Objetivo da decisão</label><input placeholder="Ex.: selecionar o melhor fornecedor" value="${esc(state.goal)}" onchange="setField('goal',this.value)"></div><div><label>Contexto, responsáveis e premissas</label><textarea onchange="setField('notes',this.value)">${esc(state.notes)}</textarea><small>Registre o significado dos critérios e o que representa uma alternativa preferível.</small></div></div></div><div class="grid"><section class="card"><h2>Critérios e subcritérios</h2><p class="muted">As alternativas serão comparadas sob cada critério terminal, isto é, sem subcritérios.</p>${state.root.children.map(n=>editor(n,'root',0)).join('')}<button onclick="add('root')">+ Adicionar critério</button></section><section class="card"><h2>Alternativas</h2><p class="muted">Cadastre pelo menos duas opções de decisão.</p>${state.alternatives.map(a=>`<div class="row"><input aria-label="Nome da alternativa" value="${esc(a.name)}" onchange="rename('${a.id}',this.value)"><button class="small" onclick="remove('${a.id}','alts')">Excluir</button></div>`).join('')}<button onclick="add('alts')">+ Adicionar alternativa</button></section></div><div class="row"><button class="primary" onclick="tab=1;render()">Ver árvore hierárquica →</button><button onclick="example()">Carregar exemplo didático</button></div>`}
function tree(){function branch(n){return `<div class="node"><strong>${esc(n.name)}</strong>${n.children.length?n.children.map(branch).join(''):`<div class="muted" style="margin-top:8px">Alternativas: ${state.alternatives.map(a=>esc(a.name)).join(' · ')||'ainda não cadastradas'}</div>`}</div>`}return `<div class="card"><span class="pill">2 · Confira a hierarquia</span><h2 style="margin-top:15px">${esc(state.goal||'Defina o objetivo')}</h2>${state.root.children.map(branch).join('')}${!validStructure()?'<div class="warn">Preencha o objetivo, pelo menos dois critérios e duas alternativas antes de obter o resultado.</div>':''}<p class="muted">Critérios irmãos são comparados em relação ao pai. Em cada folha, as mesmas alternativas são comparadas em relação àquele critério. Critérios de custo devem representar preferência por menor custo.</p><button class="primary" onclick="tab=2;render()">Iniciar julgamentos →</button></div>`}
const scale=[1/9,1/8,1/7,1/6,1/5,1/4,1/3,1/2,1,2,3,4,5,6,7,8,9];
function setJudgment(ctx,a,b,v){state.judgments[ctx]??={};delete state.judgments[ctx][key(b,a)];if(v==='')delete state.judgments[ctx][key(a,b)];else state.judgments[ctx][key(a,b)]=Number(v);touch();render()}
function judgments(){const s=status();if(!validStructure())return '<div class="card"><h2>Complete a estrutura primeiro</h2><p>Informe o objetivo, dois critérios e duas alternativas.</p><button onclick="tab=0;render()">Editar estrutura</button></div>';if(!s.cs.some(c=>c.id===selected))selected='root';const c=s.cs.find(c=>c.id===selected),r=calc(c);return `<div class="card"><span class="pill">3 · Compare dois elementos por vez</span><h2 style="margin-top:15px">Julgamentos paritários</h2><p>${s.done} de ${s.total} comparações registradas</p><progress value="${s.done}" max="${s.total||1}"></progress><label>Grupo de comparação</label><select style="width:100%" onchange="selected=this.value;render()">${s.cs.map((c,i)=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} — ${s.rs[i].done}/${s.rs[i].total}${s.rs[i].complete?(s.rs[i].cr>.1?' · revisar':' · consistente'):''}</option>`).join('')}</select><p>Em relação a <strong>${esc(c.name)}</strong>, qual elemento é ${c.leaf?'preferível':'mais importante'} e com que intensidade?</p><small>1: igual · 3: moderada · 5: forte · 7: muito forte · 9: extrema. 2, 4, 6 e 8 são intermediários. A direção da preferência aparece em cada opção.</small>${c.items.map((a,i)=>c.items.slice(i+1).map(b=>{const v=value(c.id,a.id,b.id);return `<div class="pair"><span>${esc(a.name)}</span><select aria-label="Comparar ${esc(a.name)} com ${esc(b.name)}" onchange="setJudgment('${c.id}','${a.id}','${b.id}',this.value)"><option value="">Escolha o julgamento…</option>${scale.map(x=>`<option value="${x}" ${v!==null&&Math.abs(x-v)<1e-9?'selected':''}>${x===1?'Igual preferência (1)':x>1?'← Esquerda: '+x+' vezes':'Direita: '+Math.round(1/x)+' vezes →'}</option>`).join('')}</select><span>${esc(b.name)}</span></div>`}).join('')).join('')}${c.items.length===1?'<p>Há apenas um elemento neste grupo. Seu peso local é 100%, sem comparações necessárias.</p>':''}${r.complete?diagnostic(c,r):'<div class="warn">Matriz incompleta. Os pesos e a consistência serão calculados quando todos os pares deste grupo forem julgados. Igualdade também precisa ser escolhida explicitamente.</div>'}<details><summary>Matriz de julgamentos e pesos</summary>${matrix(c,r)}</details><label>Justificativa dos julgamentos deste grupo</label><textarea onchange="state.groupNotes??={};state.groupNotes[selected]=this.value;touch()">${esc(state.groupNotes?.[c.id]||'')}</textarea><div class="row"><button onclick="selected=safeNext('${c.id}');render()">Próximo grupo →</button><button class="primary" onclick="tab=3;render()">Ver resultado</button></div></div>`}
function safeNext(id){const cs=contexts(),i=cs.findIndex(c=>c.id===id);return cs[(i+1)%cs.length].id}
function matrix(c,r){return `<div class="scroll"><table><tr><th>Elemento</th>${c.items.map(a=>`<th>${esc(a.name)}</th>`).join('')}<th>Peso local</th></tr>${c.items.map((a,i)=>`<tr><th>${esc(a.name)}</th>${r.A[i].map(v=>`<td>${v===null?'—':num(v)}</td>`).join('')}<td>${r.complete?pct(r.w[i]):'—'}</td></tr>`).join('')}</table></div>`}
function diagnostic(c,r){let tri=[];for(let i=0;i<c.items.length;i++)for(let j=i+1;j<c.items.length;j++)for(let k=j+1;k<c.items.length;k++){const expected=r.A[i][j]*r.A[j][k],actual=r.A[i][k],gap=Math.abs(Math.log(actual/expected));tri.push({i,j,k,expected,actual,gap})}tri.sort((a,b)=>b.gap-a.gap);return `<div class="${r.cr>.1+1e-10?'warn':'good'}"><strong>${c.items.length<3?'Consistência automática (menos de três elementos)':r.cr>.1+1e-10?'Revisão recomendada':'Consistência aceitável'} · RC ${pct(r.cr)}</strong><br><small>λmáx = ${num(r.lambda)} · IC = ${num(r.ci)} · IR = ${RI[c.items.length]} · Referência: RC ≤ 10%.</small></div>${tri.length&&tri[0].gap>1e-6?`<details ${r.cr>.1?'open':''}><summary>Onde revisar: tríades com maior desvio</summary><p class="muted">Diagnóstico pela diferença logarítmica |ln(aᵢₖ / (aᵢⱼ × aⱼₖ))|. Não é uma correção automática nem substitui a RC. Reveja o contexto dos três julgamentos.</p>${tri.slice(0,3).map(t=>`<p><strong>${esc(c.items[t.i].name)} / ${esc(c.items[t.j].name)} / ${esc(c.items[t.k].name)}</strong><br>As duas primeiras relações implicariam ${num(t.expected)} para a primeira em relação à terceira; o julgamento registrado é ${num(t.actual)}. Desvio: ${num(t.gap)}.${t.expected>9||t.expected<1/9?' A relação implícita está fora da escala 1/9 a 9.':''}</p>`).join('')}</details>`:''}`}
function synth(){const leaves=[];function walk(n,p){if(!n.children.length){const c=contexts().find(c=>c.id===n.id);leaves.push({node:n,weight:p,local:calc(c).w});return}const r=calc({id:n.id,items:n.children});n.children.forEach((c,i)=>walk(c,p*r.w[i]))}walk(state.root,1);return {leaves,scores:state.alternatives.map((a,i)=>({a,score:leaves.reduce((s,l)=>s+l.weight*l.local[i],0)})).sort((a,b)=>b.score-a.score)}}
function result(){const s=status();if(!s.complete)return `<div class="card"><h2>Resultado em preparação</h2><p>Complete a estrutura e todos os julgamentos para calcular a síntese final.</p><p>${s.done} de ${s.total} comparações registradas.</p>${s.cs.map((c,i)=>`<div class="row"><span>${esc(c.name)}: ${s.rs[i].done}/${s.rs[i].total}</span><button class="small" onclick="selected='${c.id}';tab=2;render()">Abrir</button></div>`).join('')}</div>`;const x=synth();return `<div class="card"><span class="pill">4 · Síntese das prioridades</span><h2 style="margin-top:15px">${esc(state.goal)}</h2><p>${esc(state.title)} · ${state.finalized?'Análise finalizada':'Análise em edição'}</p>${s.bad?`<div class="warn"><strong>Resultado provisório: ${s.bad} matriz(es) com RC acima de 10%.</strong> Revise os julgamentos antes de finalizar. O ranking abaixo é calculado com os valores atuais.</div>`:'<div class="good">Todos os grupos atendem ao limite de consistência adotado (RC ≤ 10%).</div>'}${x.scores.map((r,i)=>`<div style="margin:25px 0"><div class="rank"><span>${i+1}. ${esc(r.a.name)}</span><span>${pct(r.score)}</span></div><div class="bar"><i style="width:${100*r.score}%"></i></div></div>`).join('')}<p class="muted">Os percentuais expressam prioridades relativas neste conjunto de alternativas, critérios e julgamentos. Empates dentro de 0,01 ponto percentual devem ser interpretados com cautela.</p><div class="row"><button class="primary" onclick="finalize()">Finalizar e salvar análise</button><button onclick="exportReport()">Exportar relatório HTML</button><button onclick="window.print()">Imprimir / salvar PDF</button><button onclick="csv()">Exportar contribuições CSV</button></div></div><div class="card"><h2>Como o resultado foi composto</h2><div class="scroll"><table><tr><th>Critério terminal</th><th>Peso global</th>${state.alternatives.map(a=>`<th>${esc(a.name)}: contribuição</th>`).join('')}</tr>${x.leaves.map(l=>`<tr><td>${esc(s.cs.find(c=>c.id===l.node.id).name)}</td><td>${pct(l.weight)}</td>${l.local.map(v=>`<td>${pct(v*l.weight)}</td>`).join('')}</tr>`).join('')}</table></div><p class="muted">Cada contribuição = peso global do critério terminal × prioridade local da alternativa. A soma por alternativa forma o ranking.</p></div><div class="card"><h2>Sensibilidade dos critérios principais</h2><p class="muted">Explore um cenário alterando o peso de um critério principal. Os demais são redistribuídos proporcionalmente. Os julgamentos originais permanecem salvos.</p><select id="sensNode" onchange="sensitivity()">${state.root.children.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join('')}</select><label>Peso no cenário: <span id="sensLabel">50%</span></label><input type="range" id="sensWeight" min="0" max="100" value="50" oninput="sensitivity()"><div id="sensOut"><button onclick="sensitivity()">Calcular cenário</button></div></div><div class="card"><h2>Auditoria dos julgamentos</h2>${s.cs.map((c,i)=>`<details><summary>${esc(c.name)} · RC ${pct(s.rs[i].cr)}</summary>${diagnostic(c,s.rs[i])}${matrix(c,s.rs[i])}<p>${esc(state.groupNotes?.[c.id]||'Sem justificativa registrada.')}</p></details>`).join('')}</div>`}
function sensitivity(){const index=Number(document.getElementById('sensNode').value),q=Number(document.getElementById('sensWeight').value)/100,base=calc({id:'root',items:state.root.children}).w,x=synth();document.getElementById('sensLabel').textContent=pct(q);const scores=state.alternatives.map((a,i)=>({name:a.name,v:x.leaves.reduce((sum,l)=>{let top=state.root.children.findIndex(c=>!!find(l.node.id,c));const ratio=top===index?q/base[top]:(1-q)/(1-base[index]);return sum+l.weight*ratio*l.local[i]},0)})).sort((a,b)=>b.v-a.v);document.getElementById('sensOut').innerHTML=scores.map(s=>`<p><strong>${esc(s.name)}</strong>: ${pct(s.v)}</p>`).join('')}
function method(){return `<div class="card"><span class="pill">5 · Transparência do método</span><h2 style="margin-top:15px">Matemática, consistência e interpretação</h2><h3>1. Escala e matriz recíproca</h3><p>A matriz positiva A registra a preferência do elemento i sobre j: aᵢⱼ. A diagonal vale 1 e aⱼᵢ = 1/aᵢⱼ. A escala de Saaty usa 1 (igual), 3 (moderada), 5 (forte), 7 (muito forte), 9 (extrema), valores intermediários pares e seus recíprocos. Julgamentos ausentes não são tratados como igualdade.</p><h3>2. Prioridades pelo autovetor principal</h3><p>A aplicação resolve A w = λmáx w por iteração de potência: inicia com pesos iguais, multiplica por A e normaliza pela soma até a maior mudança ser menor que 10⁻¹³ (máximo de 10.000 iterações). Os pesos são positivos e somam 1. λmáx é estimado pela média de (Aw)ᵢ/wᵢ. Esse procedimento difere da aproximação pela média das linhas da matriz normalizada.</p><h3>3. Índice e razão de consistência</h3><p>IC = (λmáx − n)/(n − 1). RC = IC/IR(n). Para n ≥ 3, a aplicação adota RC ≤ 0,10 como referência usual de aceitabilidade. Para n = 1 ou 2, uma matriz positiva recíproca é automaticamente consistente e a RC é apresentada como zero por convenção, sem divisão por IR = 0.</p><div class="scroll"><table><tr><th>n</th>${RI.slice(1).map((v,i)=>`<td>${i+1}</td>`).join('')}</tr><tr><th>IR</th>${RI.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr></table></div><p>Consistência perfeita exige aᵢₖ = aᵢⱼ × aⱼₖ para todas as tríades. Por exemplo, A/B = 3 e B/C = 2 implicam A/C = 6. A aplicação ordena tríades pelo desvio logarítmico para orientar a revisão. Uma RC baixa mede coerência interna, não garante qualidade dos critérios nem verdade dos julgamentos. Não se deve ajustar respostas apenas para passar no limite.</p><h3>4. Síntese distributiva</h3><p>O peso global de cada folha é o produto dos pesos locais no caminho desde o objetivo. A prioridade final de cada alternativa é a soma das suas prioridades locais multiplicadas pelos pesos globais das folhas. A inclusão ou exclusão de alternativas pode alterar prioridades e até inverter posições. O modelo pressupõe uma hierarquia adequada e independência suficiente entre critérios. Evite dupla contagem e compare elementos de significado e escala compatíveis.</p><h3>5. Salvamento e uso</h3><p>“Salvar trabalho” baixa um arquivo JSON com estrutura, julgamentos e anotações, mesmo incompletos. “Abrir análise” recupera esse arquivo. Há também recuperação automática neste navegador quando o armazenamento local estiver disponível, mas ela não substitui a cópia em arquivo. Ao editar, o estado finalizado volta a ser rascunho. A finalização requer todos os pares e RC ≤ 10% em todos os grupos. O relatório HTML inclui matrizes, justificativas e resultado. Para PDF, use a impressão do navegador.</p><h3>Referências consultadas</h3><ul><li><a href="https://www.pmi.org/learning/library/analytic-hierarchy-process-prioritize-projects-6608" target="_blank" rel="noopener">Vargas, R. V. (2010). Using the analytic hierarchy process (AHP) to select and prioritize projects in a portfolio. PMI.</a> Escala, estruturação e aplicação do método.</li><li><a href="https://pure.port.ac.uk/ws/files/42847/ORI-preprint-AIshizaka.pdf" target="_blank" rel="noopener">Ishizaka, A.; Labib, A. (2009). Analytic Hierarchy Process and Expert Choice: Benefits and Limitations.</a> Autovetor, IR, consistência, síntese e limitações.</li><li><a href="https://arxiv.org/abs/1605.05777" target="_blank" rel="noopener">Saaty, T.; Kułakowski, K. (2016). Axioms of the Analytic Hierarchy Process and its Generalization to Dependence and Feedback.</a> Fundamentos da modelagem hierárquica.</li></ul><p class="muted">Material de apoio fornecido: AHP-analise-multicriterio.pptx. Complementação matemática com as fontes acima. Não são necessários serviços externos para executar os cálculos.</p></div>`}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function filename(){return (state.title||'analise-ahp').replace(/[^a-zA-Z0-9À-ÿ_-]+/g,'-').slice(0,70)}
function saveFile(){state.savedAt=new Date().toISOString();download(filename()+'.json',JSON.stringify(state,null,2),'application/json');dirty=false;notify('Arquivo de análise enviado para download.')}
function validate(s){if(!s||s.format!=='AHP-Lab'||s.version!==1||typeof s.title!=='string'||typeof s.goal!=='string'||typeof s.notes!=='string'||!s.root||s.root.id!=='root'||!Array.isArray(s.alternatives)||!s.judgments||Array.isArray(s.judgments))throw Error('Formato de análise inválido.');let count=0;const ids=new Set();function node(n,depth){if(depth>15||++count>500||!n||typeof n.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(n.id)||ids.has(n.id)||typeof n.name!=='string'||n.name.length>1000||!Array.isArray(n.children)||n.children.length>10)throw Error('Estrutura inválida ou excessiva.');ids.add(n.id);n.children.forEach(c=>node(c,depth+1))}node(s.root,0);if(s.alternatives.length>10)throw Error('Máximo de 10 alternativas.');s.alternatives.forEach(a=>{node(a,0);if(a.children.length)throw Error('Alternativa inválida.')});for(const [ctx,j] of Object.entries(s.judgments)){if(!j||typeof j!=='object'||Array.isArray(j))throw Error('Julgamentos inválidos.');for(const v of Object.values(j))if(typeof v!=='number'||!scale.some(x=>Math.abs(x-v)<1e-12))throw Error('Valor fora da escala de Saaty.')}if(s.groupNotes&&Object.values(s.groupNotes).some(v=>typeof v!=='string'))throw Error('Anotações inválidas.');return s}
async function loadFile(input){const f=input.files[0];if(!f)return;try{if(f.size>2000000)throw Error('Arquivo maior que 2 MB.');const next=validate(JSON.parse(await f.text()));if(!confirm('Abrir este arquivo e substituir o trabalho atual? Salve uma cópia antes, se necessário.'))return;state=next;selected='root';tab=0;dirty=false;try{localStorage.setItem('ahp-lab-v1',JSON.stringify(state))}catch(e){}notify('Análise aberta.');render()}catch(e){alert('Não foi possível abrir: '+e.message)}input.value=''}
function newAnalysis(){if(!confirm('Começar uma nova análise? Salve o trabalho atual antes, se necessário.'))return;state=blank();tab=0;selected='root';touch();render()}
function finalize(){const s=status();if(!s.complete||s.bad)return alert('Complete todos os julgamentos e revise as matrizes com RC acima de 10% antes de finalizar.');state.finalized=true;try{localStorage.setItem('ahp-lab-v1',JSON.stringify(state))}catch(e){}saveFile();render()}
function exportReport(){if(!status().complete)return;const css=document.querySelector('style').textContent;download(filename()+'-relatorio.html','<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Relatório AHP</title><style>'+css+'button,input,select{display:none} details>*{display:block}details{break-inside:avoid}</style><main><h1>Relatório AHP</h1><p>Emitido em '+esc(new Date().toLocaleString('pt-BR'))+'</p><p>'+esc(state.notes)+'</p>'+tree()+result()+method()+'</main></html>','text/html;charset=utf-8')}
function csv(){const x=synth(),quote=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['Critério terminal','Peso global',...state.alternatives.map(a=>a.name)],...x.leaves.map(l=>[contexts().find(c=>c.id===l.node.id).name,l.weight,...l.local.map(v=>v*l.weight)]),['TOTAL',1,...state.alternatives.map(a=>x.scores.find(r=>r.a.id===a.id).score)]];download(filename()+'.csv','\ufeff'+rows.map(r=>r.map(v=>quote(typeof v==='number'?String(v).replace('.',','):v)).join(';')).join('\r\n'),'text/csv;charset=utf-8')}

 if(!confirm('Carregar o exemplo dos slides e substituir o trabalho atual?'))return;
 state=blank();state.title='Exemplo dos slides • Botafogo e Leblon';state.goal='Escolher o bairro da loja';state.notes='Julgamentos do material didático, sem representar uma avaliação atual dos bairros. Resultado de referência: Botafogo 30,73%; Leblon 69,27%.';

 state.judgments={root:{'access|quality':1/3},quality:{'shops|centers':1/5},access:{'botafogo|leblon':3},shops:{'botafogo|leblon':1/7},centers:{'botafogo|leblon':1/5}};

const baseContexts=contexts;
contexts=function(){return baseContexts().sort((a,b)=>Number(a.leaf)-Number(b.leaf))};
let pairIndex=0, draftDirection=null, draftStrength=1, guideContext=null;
function pairList(c){const pairs=[];c.items.forEach((a,i)=>c.items.slice(i+1).forEach(b=>pairs.push({a,b})));return pairs}
function goGroup(id){selected=id;const c=contexts().find(c=>c.id===id),pairs=pairList(c),missing=pairs.findIndex(p=>value(id,p.a.id,p.b.id)===null);pairIndex=missing<0?0:missing;guideContext=null;tab=2;render()}
function loadDraft(c,p){const v=value(c.id,p.a.id,p.b.id);draftDirection=v===null?null:v===1?'equal':v>1?'left':'right';draftStrength=v===null?3:Math.round(v>=1?v:1/v)}
function chooseDirection(d){draftDirection=d;if(d==='equal')draftStrength=1;else if(draftStrength===1)draftStrength=3;render()}
function chooseStrength(n){draftStrength=n;render()}
function movePair(index){pairIndex=index;guideContext=null;render()}
function recordPair(){const c=contexts().find(c=>c.id===selected),pairs=pairList(c),p=pairs[pairIndex];if(!draftDirection)return notify('Escolha qual elemento é preferível ou indique equivalência.');const v=draftDirection==='equal'?1:draftDirection==='left'?draftStrength:1/draftStrength;state.judgments[c.id]??={};delete state.judgments[c.id][key(p.b.id,p.a.id)];state.judgments[c.id][key(p.a.id,p.b.id)]=v;touch();const missing=pairs.findIndex((p,i)=>i>pairIndex&&value(c.id,p.a.id,p.b.id)===null);if(missing>=0){pairIndex=missing;guideContext=null}else{const earlier=pairs.findIndex(p=>value(c.id,p.a.id,p.b.id)===null);if(earlier>=0){pairIndex=earlier;guideContext=null}else pairIndex=pairs.length}render()}
function nextPending(){const cs=contexts(),c=cs.find(c=>!calc(c).complete);if(c)goGroup(c.id);else {tab=3;render()}}
const intensity={1:'igual',2:'intermediária entre igual e moderada',3:'moderada',4:'intermediária entre moderada e forte',5:'forte',6:'intermediária entre forte e muito forte',7:'muito forte',8:'intermediária entre muito forte e extrema',9:'extrema'};
function matrix(c,r){return `<p class="muted">Leia cada célula como “elemento da linha em relação ao elemento da coluna”. Esta tabela é apenas de consulta.</p><div class="legend"><span class="matrix-direct">■ Acima da diagonal: seu julgamento</span><span class="matrix-auto">■ Abaixo: recíproco automático</span><span class="matrix-diag">■ Diagonal: sempre 1</span></div><div class="scroll"><table><tr><th>Elemento</th>${c.items.map(a=>`<th>${esc(a.name)}</th>`).join('')}<th>Peso local</th></tr>${c.items.map((a,i)=>`<tr><th>${esc(a.name)}</th>${r.A[i].map((v,j)=>`<td class="${i===j?'matrix-diag':i<j?'matrix-direct':'matrix-auto'}" title="${i===j?'Mesmo elemento':i<j?'Julgamento informado':'Recíproco preenchido automaticamente'}">${v===null?'—':num(v)}${i>j&&v!==null?' <small>↺</small>':''}</td>`).join('')}<td>${r.complete?pct(r.w[i]):'—'}</td></tr>`).join('')}</table></div>`}
function tree(){function branch(n,level){return `<div class="org-branch"><div class="org-box"><small>${level===1?'Critério':'Subcritério · nível '+level}</small><strong>${esc(n.name)}</strong></div>${n.children.length?`<div class="org-children">${n.children.map(c=>branch(c,level+1)).join('')}</div>`:`<div class="org-leaf"><small>Comparar aqui as alternativas</small>${state.alternatives.map(a=>`<div class="org-alt">${esc(a.name)}</div>`).join('')||'<small>Cadastre as alternativas</small>'}</div>`}</div>`}const count=contexts().length;return `<div class="card"><span class="pill">2 · Entenda a estrutura</span><h2 style="margin-top:15px">O mapa da sua decisão</h2><div class="learning"><h3>Como ler esta árvore</h3><p>Comece pelo objetivo no topo. Os critérios explicam o que importa para decidir. Subcritérios detalham um critério. Na base de cada ramo, você compara as alternativas.</p><p><strong>Exemplo:</strong> se o ramo for “Custo”, pergunte qual alternativa oferece a condição de custo mais desejável. Menor custo costuma ser preferível.</p></div><div class="org"><div class="org-root"><small>OBJETIVO</small>${esc(state.goal||'Defina o objetivo da decisão')}</div><div class="org-children">${state.root.children.map(c=>branch(c,1)).join('')}</div></div><div class="learning"><h3>Por que as alternativas aparecem várias vezes?</h3><p>São as mesmas opções, avaliadas sob perspectivas diferentes. Uma alternativa pode ser melhor em custo e outra em qualidade. Os pesos combinam essas avaliações no final.</p></div>${!validStructure()?'<div class="warn">Preencha o objetivo, pelo menos dois critérios e duas alternativas antes de iniciar.</div>':`<p>Seu modelo terá <strong>${count} grupos de avaliação</strong>. Você fará um julgamento por par. Não precisa preencher uma matriz inteira.</p>`}<div class="completion-actions"><button onclick="tab=0;render()">← Ajustar estrutura</button><button class="primary" onclick="goGroup('root')">Começar pelo peso dos critérios →</button></div></div>`}
function judgments(){if(!validStructure())return `<div class="card"><h2>Vamos começar pela estrutura</h2><p>Defina o objetivo, pelo menos dois critérios e duas alternativas para abrir o roteiro de comparações.</p><button class="primary" onclick="tab=0;render()">Preencher estrutura</button></div>`;const s=status();let c=s.cs.find(c=>c.id===selected);if(!c){selected='root';c=s.cs[0]}const r=calc(c),pairs=pairList(c);pairIndex=Math.max(0,Math.min(pairIndex,pairs.length));if(pairIndex===pairs.length&&!r.complete&&pairs.length)pairIndex=pairs.findIndex(p=>value(c.id,p.a.id,p.b.id)===null);const p=pairs[pairIndex],token=c.id+':'+pairIndex;if(p&&guideContext!==token){loadDraft(c,p);guideContext=token}const groupIndex=s.cs.findIndex(g=>g.id===c.id),groupTitle=c.id==='root'?'Quais critérios mais importam para o objetivo?':c.leaf?'Qual alternativa atende melhor a este critério?':'Quais subcritérios mais importam neste ramo?';let body='';if(p){const winner=draftDirection==='left'?p.a.name:p.b.name;body=`<div class="compare-stage"><span class="pill">Par ${pairIndex+1} de ${pairs.length} neste grupo</span><h3>${c.leaf?'Qual opção é preferível':'Qual elemento é mais importante'} em relação a <em>${esc(c.name)}</em>?</h3><div class="compare-cards"><div class="choice-card ${draftDirection==='left'?'chosen':''}"><strong>ELEMENTO A</strong>${esc(p.a.name)}</div><div class="vs">×</div><div class="choice-card ${draftDirection==='right'?'chosen':''}"><strong>ELEMENTO B</strong>${esc(p.b.name)}</div></div><label>1. Indique a direção da preferência</label><div class="choices"><button class="${draftDirection==='left'?'selected':''}" onclick="chooseDirection('left')">A: ${esc(p.a.name)}</button><button class="${draftDirection==='equal'?'selected':''}" onclick="chooseDirection('equal')">São equivalentes</button><button class="${draftDirection==='right'?'selected':''}" onclick="chooseDirection('right')">B: ${esc(p.b.name)}</button></div>${draftDirection&&draftDirection!=='equal'?`<label>2. Qual é a intensidade dessa preferência?</label><div class="strengths">${[2,3,4,5,6,7,8,9].map(n=>`<button title="${n}: ${intensity[n]}" class="${draftStrength===n?'selected':''}" onclick="chooseStrength(${n})">${n}</button>`).join('')}</div><p><strong>${draftStrength} · Preferência ${intensity[draftStrength]}</strong></p><p class="muted">3 moderada · 5 forte · 7 muito forte · 9 extrema<br>2, 4, 6 e 8 representam intensidades intermediárias.</p>`:''}<div class="preview">${!draftDirection?'Escolha uma das três opções acima para formular seu julgamento.':draftDirection==='equal'?`Seu julgamento: <strong>${esc(p.a.name)}</strong> e <strong>${esc(p.b.name)}</strong> têm a mesma preferência neste contexto (valor 1).`:`Seu julgamento: <strong>${esc(winner)}</strong> recebe preferência <strong>${intensity[draftStrength]}</strong> (${draftStrength}) em relação a <strong>${esc(draftDirection==='left'?p.b.name:p.a.name)}</strong>.`}</div><div class="learning" style="text-align:left"><strong>Você só responde este par uma vez.</strong><p>Se A/B = 3, a aplicação registra B/A = 1/3 automaticamente. A diagonal A/A é sempre 1. Assim, ${c.items.length} elementos exigem apenas ${pairs.length} julgamento(s), e não ${c.items.length*c.items.length}.</p></div><div class="completion-actions"><button ${pairIndex===0?'disabled':''} onclick="movePair(${pairIndex-1})">← Par anterior</button><button class="primary" ${draftDirection===null?'disabled':''} onclick="recordPair()">Registrar e continuar →</button></div><details><summary>Revisar ou escolher um par específico</summary>${pairs.map((q,i)=>`<div class="row"><button class="small" onclick="movePair(${i})">${i+1}. ${esc(q.a.name)} × ${esc(q.b.name)} · ${value(c.id,q.a.id,q.b.id)===null?'pendente':'registrado'}</button></div>`).join('')}</details></div>`}else{body=`<div class="good"><strong>Grupo concluído!</strong> ${pairs.length?`Você registrou os ${pairs.length} pares necessários.`:'Este grupo tem um único elemento, com peso local de 100%.'}</div>${diagnostic(c,r)}<h3>O que os julgamentos produziram?</h3>${c.items.map((a,i)=>`<div class="row"><strong>${esc(a.name)}</strong><span>${pct(r.w[i])}</span></div>`).join('')}<p class="muted">Os pesos locais somam 100% dentro deste grupo. Eles ainda serão combinados com os demais níveis para formar o resultado final.</p><div class="completion-actions"><button onclick="movePair(0)">Revisar os pares deste grupo</button><button class="primary" onclick="nextPending()">${s.complete?'Ver síntese final':'Continuar para o próximo grupo pendente'} →</button></div>`}
return `<div class="card"><span class="pill">3 · Julgue com orientação</span><h2 style="margin-top:15px">${groupTitle}</h2><p>Progresso da análise: <strong>${s.done} de ${s.total} pares</strong> · Grupo ${groupIndex+1} de ${s.cs.length}</p><progress value="${s.done}" max="${s.total||1}"></progress><div class="journey"><span class="${!c.leaf?'current':''}">① Pesar critérios e subcritérios</span><span class="${c.leaf?'current':''}">② Avaliar alternativas por critério</span><span>③ Combinar as prioridades</span></div><div class="learning"><strong>Contexto deste grupo: ${esc(c.name)}</strong><p>${c.id==='root'?'Compare a importância dos critérios para alcançar o objetivo. Ainda não estamos comparando alternativas.':c.leaf?'Agora compare as alternativas somente sob este critério. Deixe os outros critérios para seus próprios grupos.':'Compare somente os subcritérios deste mesmo pai. Os pesos expressam a importância de cada um dentro desse ramo.'}</p><p>Baseie a resposta em uma justificativa ou evidência. Use 1 para equivalência real. Você pode salvar o trabalho a qualquer momento e continuar depois.</p></div>${body}<details><summary>Ver matriz: julgamentos e recíprocos automáticos</summary>${matrix(c,r)}</details><label>Registre a justificativa ou evidência deste grupo</label><textarea placeholder="Ex.: dados usados, responsáveis e motivos da preferência" onchange="state.groupNotes??={};state.groupNotes[selected]=this.value;touch()">${esc(state.groupNotes?.[c.id]||'')}</textarea><details><summary>Mapa dos grupos e progresso</summary><div class="group-list">${s.cs.map((g,i)=>`<button class="group-item" onclick="goGroup('${g.id}')"><strong>${i+1}. ${esc(g.name)}</strong><small>${s.rs[i].done}/${s.rs[i].total} pares · ${s.rs[i].complete?(s.rs[i].cr>.1?'Revisar consistência':'Concluído'):'Em andamento'}</small></button>`).join('')}</div></details></div>`}
const originalStructure=structure;
structure=function(){return `<div class="card"><span class="pill">Roteiro de aprendizagem</span><h2 style="margin-top:15px">Uma decisão, passo a passo</h2><p>Você vai construir um modelo de decisão e justificar suas preferências. Ao final, o AHP combinará essas escolhas em um ranking.</p><div class="grid"><div><div class="lesson-row"><span class="lesson-number">1</span><p><strong>Defina a decisão.</strong><br>Escreva o objetivo, cadastre opções viáveis e escolha critérios claros. Exclua antes as opções que não atendem aos requisitos obrigatórios.</p></div><div class="lesson-row"><span class="lesson-number">2</span><p><strong>Confira a árvore.</strong><br>Veja como critérios, subcritérios e alternativas se relacionam. Evite avaliar o mesmo aspecto em dois ramos.</p></div></div><div><div class="lesson-row"><span class="lesson-number">3</span><p><strong>Compare um par de cada vez.</strong><br>Primeiro a importância dos critérios. Depois a preferência pelas alternativas em cada critério terminal. A aplicação calcula os recíprocos.</p></div><div class="lesson-row"><span class="lesson-number">4</span><p><strong>Interprete e revise.</strong><br>Confira a consistência, explique o ranking e explore como mudanças nos pesos podem alterar a decisão.</p></div></div></div><div class="learning"><strong>Primeiro contato com AHP?</strong><p>Carregue o exemplo Botafogo × Leblon dos slides para explorar uma análise pronta. Para fazer sua atividade, use “Nova análise”.</p><button onclick="example()">Explorar exemplo dos slides</button></div></div>`+originalStructure()};
const originalResult=result;
result=function(){return `<div class="learning"><h3>Como interpretar esta etapa</h3><p>As prioridades resultam dos julgamentos que você registrou. Confira se o ranking faz sentido à luz das evidências. Os percentuais são prioridades relativas, não probabilidades nem previsão de lucro.</p><p>Se houver inconsistência, volte ao grupo indicado e reveja os pares com maior conflito. Depois teste a sensibilidade: a recomendação continua igual quando um critério ganha peso?</p></div>`+originalResult()};
const originalNewAnalysis=newAnalysis;
newAnalysis=function(){pairIndex=0;guideContext=null;originalNewAnalysis()};
